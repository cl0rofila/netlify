<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lojinha - Gestão de Vendas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-100 text-gray-800" x-data="sistemaVendas()">

  <div class="max-w-5xl mx-auto p-4">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-3xl font-bold text-blue-600">Lojinha - Gestão de Vendas</h1>
      <span class="text-xs bg-green-100 text-green-800 px-2 py-1 rounded border border-green-300 font-bold">☁️ Conectado à Nuvem</span>
    </div>
    
    <!-- Menu de Navegação -->
    <div class="flex space-x-2 mb-6 border-b pb-2 overflow-x-auto">
      <button @click="abaAtiva = 'vendas'" :class="abaAtiva === 'vendas' ? 'bg-blue-600 text-white' : 'bg-white text-gray-600'" class="px-4 py-2 rounded shadow text-sm font-bold">🛒 Nova Venda</button>
      <button @click="abaAtiva = 'produtos'" :class="abaAtiva === 'produtos' ? 'bg-blue-600 text-white' : 'bg-white text-gray-600'" class="px-4 py-2 rounded shadow text-sm font-bold">📦 Produtos</button>
      <button @click="abaAtiva = 'clientes'" :class="abaAtiva === 'clientes' ? 'bg-blue-600 text-white' : 'bg-white text-gray-600'" class="px-4 py-2 rounded shadow text-sm font-bold">👥 Clientes</button>
      <button @click="abaAtiva = 'catalogo'" :class="abaAtiva === 'catalogo' ? 'bg-blue-600 text-white' : 'bg-white text-gray-600'" class="px-4 py-2 rounded shadow text-sm font-bold">📱 Catálogo</button>
    </div>

    <!-- 1. ABA PRODUTOS -->
    <div x-show="abaAtiva === 'produtos'" style="display: none;">
      <div class="bg-white p-4 rounded shadow mb-6 border-t-4 border-blue-500">
        <h2 class="text-lg font-bold mb-4">Cadastrar Novo Produto</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
          <input type="text" x-model="formProduto.nome" placeholder="Nome do Produto" class="border p-2 rounded w-full">
          <input type="text" x-model="formProduto.foto" placeholder="Link da Foto (URL) - Opcional" class="border p-2 rounded w-full">
        </div>
        <div class="grid grid-cols-3 gap-4 mb-4">
          <div><label class="text-xs text-gray-500 font-bold">Qtd. Estoque</label><input type="number" x-model.number="formProduto.estoque" class="border p-2 rounded w-full"></div>
          <div><label class="text-xs text-gray-500 font-bold">Custo (R$)</label><input type="number" x-model.number="formProduto.custo" class="border p-2 rounded w-full"></div>
          <div><label class="text-xs text-gray-500 font-bold">Venda (R$)</label><input type="number" x-model.number="formProduto.preco" class="border p-2 rounded w-full"></div>
        </div>
        <button @click="salvarProduto" class="bg-blue-600 text-white px-4 py-2 rounded w-full font-bold hover:bg-blue-700 disabled:opacity-50" :disabled="carregando">
          <span x-show="!carregando">Cadastrar Produto</span>
          <span x-show="carregando">Salvando...</span>
        </button>
      </div>

      <h3 class="font-bold text-gray-700 mb-2">Estoque Atual</h3>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <template x-for="prod in produtos" :key="prod.id">
          <div class="bg-white p-4 rounded shadow border border-gray-200">
            <h4 x-text="prod.nome" class="font-bold text-lg border-b pb-2 mb-2"></h4>
            <p class="text-sm">Disponível: <span x-text="prod.estoque" class="font-bold text-blue-600"></span> | Vendidos: <span x-text="prod.vendidos" class="font-bold text-green-600"></span></p>
            <p class="text-sm">Venda: R$ <span x-text="prod.preco"></span></p>
            <p class="text-sm text-green-600 font-bold">Lucro Unitário: R$ <span x-text="(prod.preco - prod.custo).toFixed(2)"></span></p>
          </div>
        </template>
        <div x-show="produtos.length === 0" class="text-gray-500 col-span-3 text-sm italic">Nenhum produto cadastrado.</div>
      </div>
    </div>

    <!-- 2. ABA CLIENTES -->
    <div x-show="abaAtiva === 'clientes'" style="display: none;">
      <div class="bg-white p-4 rounded shadow mb-6 border-t-4 border-blue-500">
        <h2 class="text-lg font-bold mb-4">Cadastrar Novo Cliente</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
          <input type="text" x-model="formCliente.nome" placeholder="Nome do Cliente" class="border p-2 rounded w-full">
          <input type="text" x-model="formCliente.whatsapp" placeholder="WhatsApp (Ex: 11999999999)" class="border p-2 rounded w-full">
        </div>
        <textarea x-model="formCliente.obs" placeholder="Observações do cliente..." class="border p-2 rounded w-full mb-4"></textarea>
        <button @click="salvarCliente" class="bg-blue-600 text-white px-4 py-2 rounded w-full font-bold hover:bg-blue-700 disabled:opacity-50" :disabled="carregando">
          <span x-show="!carregando">Cadastrar Cliente</span>
          <span x-show="carregando">Salvando...</span>
        </button>
      </div>

      <h3 class="font-bold text-gray-700 mb-2">Lista de Clientes</h3>
      <div class="space-y-2">
        <template x-for="cli in clientes" :key="cli.id">
          <div class="bg-white p-4 rounded shadow border border-gray-200">
            <h4 x-text="cli.nome" class="font-bold text-lg text-blue-800"></h4>
            <p class="text-sm text-gray-600">WhatsApp: <span x-text="cli.whatsapp"></span></p>
            <p class="text-sm text-gray-500 italic mt-1" x-text="cli.obs"></p>
          </div>
        </template>
        <div x-show="clientes.length === 0" class="text-gray-500 text-sm italic">Nenhum cliente cadastrado.</div>
      </div>
    </div>

    <!-- 3. ABA VENDAS -->
    <div x-show="abaAtiva === 'vendas'">
      <div class="bg-white p-4 rounded shadow mb-6 border-t-4 border-green-500">
        <h2 class="text-lg font-bold mb-4">Registrar Nova Venda</h2>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
          <div>
            <label class="text-sm font-bold text-gray-600">Selecionar Cliente</label>
            <select x-model="formVenda.clienteId" class="border p-2 rounded w-full">
              <option value="">-- Escolha um cliente --</option>
              <template x-for="cli in clientes" :key="cli.id"><option :value="cli.id" x-text="cli.nome"></option></template>
            </select>
          </div>
          <div>
            <label class="text-sm font-bold text-gray-600">Selecionar Produto</label>
            <select x-model="formVenda.produtoId" @change="atualizarPrecoVenda" class="border p-2 rounded w-full">
              <option value="">-- Escolha um produto --</option>
              <template x-for="prod in produtos" :key="prod.id">
                <option :value="prod.id" x-text="`${prod.nome} (Estoque: ${prod.estoque})`" :disabled="prod.estoque <= 0"></option>
              </template>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4">
          <div><label class="text-xs text-gray-500 font-bold">Valor Original (R$)</label><input type="number" readonly x-model="formVenda.valorOriginal" class="border p-2 rounded w-full bg-gray-100"></div>
          <div><label class="text-xs text-gray-500 font-bold">Desconto (R$)</label><input type="number" x-model.number="formVenda.desconto" @input="calcularTotal" class="border p-2 rounded w-full border-blue-300"></div>
          <div><label class="text-xs text-gray-500 font-bold">Valor Final (R$)</label><input type="number" readonly x-model="formVenda.valorFinal" class="border p-2 rounded w-full bg-green-50 font-bold text-green-700"></div>
          <div>
            <label class="text-xs text-gray-500 font-bold">Pagamento</label>
            <select x-model="formVenda.pagamento" class="border p-2 rounded w-full">
              <option value="Dinheiro">Dinheiro</option>
              <option value="Pix">Pix</option>
              <option value="Cartão">Cartão</option>
            </select>
          </div>
        </div>

        <div x-show="formVenda.pagamento === 'Cartão'" class="mb-4 bg-gray-50 p-3 rounded border">
          <label class="text-sm font-bold text-gray-600">Número de Parcelas</label>
          <input type="number" x-model.number="formVenda.parcelas" min="1" max="12" class="border p-2 rounded w-full mt-1">
        </div>

        <button @click="finalizarVenda" class="bg-green-600 text-white px-4 py-3 rounded w-full font-bold text-lg hover:bg-green-700 shadow disabled:opacity-50" :disabled="carregando">
          <span x-show="!carregando">Finalizar Venda 💰</span>
          <span x-show="carregando">Processando...</span>
        </button>
      </div>

      <!-- Histórico -->
      <h3 class="font-bold text-gray-700 mb-2">Últimas Vendas</h3>
      <div class="space-y-3">
        <template x-for="venda in vendas" :key="venda.id">
          <div class="bg-white p-4 rounded shadow border-l-4 border-green-500">
            <div class="flex justify-between items-start">
              <div>
                <p class="font-bold" x-text="obterNomeProduto(venda.produtoId)"></p>
                <p class="text-sm text-gray-600">Comprador: <span class="font-semibold text-gray-800" x-text="obterNomeCliente(venda.clienteId)"></span></p>
                <p class="text-xs text-gray-500 mt-1">
                  Pagamento: <span x-text="venda.pagamento"></span> 
                  <span x-show="venda.parcelas > 1" x-text="`em ${venda.parcelas}x`"></span>
                </p>
              </div>
              <div class="text-right">
                <p class="font-bold text-green-700 text-lg">R$ <span x-text="venda.valorFinal.toFixed(2)"></span></p>
              </div>
            </div>
            
            <template x-if="venda.pagamento === 'Cartão' && venda.parcelas > 1">
              <a :href="gerarLinkAgenda(venda)" target="_blank" class="mt-3 inline-block bg-blue-100 text-blue-700 text-xs px-3 py-1 rounded font-bold hover:bg-blue-200 border border-blue-200">
                📅 Lembrete de Parcela (Agenda)
              </a>
            </template>
          </div>
        </template>
        <div x-show="vendas.length === 0" class="text-gray-500 text-sm italic">Nenhuma venda registrada ainda.</div>
      </div>
    </div>

    <!-- 4. ABA CATÁLOGO -->
    <div x-show="abaAtiva === 'catalogo'" style="display: none;">
      <div class="flex justify-between items-center mb-6 bg-white p-3 rounded shadow">
        <h2 class="text-xl font-bold">Catálogo de Produtos</h2>
        <button @click="copiarLink" class="bg-blue-600 text-white px-3 py-1 rounded text-sm shadow hover:bg-blue-700 font-bold">🔗 Copiar Link p/ Cliente</button>
      </div>

      <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <template x-for="prod in produtos" :key="prod.id">
          <div class="bg-white rounded shadow border border-gray-200 overflow-hidden flex flex-col">
            <div class="h-40 bg-gray-100 flex items-center justify-center border-b">
              <template x-if="prod.foto">
                <img :src="prod.foto" class="w-full h-full object-cover">
              </template>
              <template x-if="!prod.foto">
                <span class="text-gray-300 text-4xl">📷</span>
              </template>
            </div>
            <div class="p-3 text-center flex-grow flex flex-col justify-between">
              <div>
                <h4 x-text="prod.nome" class="font-bold text-gray-800 leading-tight mb-2"></h4>
                <p class="text-xs bg-blue-50 text-blue-700 rounded-full px-2 py-1 inline-block mb-1 font-bold" x-show="prod.estoque > 0">Disponível: <span x-text="prod.estoque"></span></p>
                <p class="text-xs bg-red-50 text-red-700 rounded-full px-2 py-1 inline-block mb-1 font-bold" x-show="prod.estoque <= 0">Esgotado</p>
              </div>
              <p class="font-black text-lg text-green-600 mt-2">R$ <span x-text="prod.preco"></span></p>
            </div>
          </div>
        </template>
      </div>
    </div>

  </div>

  <!-- FIREBASE CONFIGURATION (V9) -->
  <script type="module">
    // Importações
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Suas credenciais oficiais extraídas da imagem enviada
    const firebaseConfig = {
      apiKey: "AIzaSyAEl8GmiQKY_tMhLTtUuUdnJ665K_0qxuU",
      authDomain: "site-lojinha-d6365.firebaseapp.com",
      projectId: "site-lojinha-d6365",
      storageBucket: "site-lojinha-d6365.firebasestorage.app",
      messagingSenderId: "343435254123",
      appId: "1:343435254123:web:256fe3e698b98d63c0d42e"
    };

    // Inicializa Nuvem
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.addEventListener('alpine:init', () => {
      Alpine.data('sistemaVendas', () => ({
        abaAtiva: 'vendas',
        carregando: false,
        produtos: [],
        clientes: [],
        vendas: [],

        formProduto: { nome: '', foto: '', estoque: 0, custo: 0, preco: 0 },
        formCliente: { nome: '', whatsapp: '', obs: '' },
        formVenda: { clienteId: '', produtoId: '', valorOriginal: 0, desconto: 0, valorFinal: 0, pagamento: 'Dinheiro', parcelas: 1 },

        // INIT: Busca os dados da nuvem em tempo real
        init() {
          // Escuta Produtos
          onSnapshot(collection(db, "produtos"), (snapshot) => {
            this.produtos = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          });
          // Escuta Clientes
          onSnapshot(collection(db, "clientes"), (snapshot) => {
            this.clientes = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          });
          // Escuta Vendas (mostra as mais recentes primeiro)
          onSnapshot(collection(db, "vendas"), (snapshot) => {
            let lista = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            lista.sort((a, b) => new Date(b.data) - new Date(a.data)); 
            this.vendas = lista;
          });
        },

        async salvarProduto() {
          if(!this.formProduto.nome || this.formProduto.preco <= 0) return alert("Preencha o nome e o valor de venda!");
          this.carregando = true;
          try {
            await addDoc(collection(db, "produtos"), {
              nome: this.formProduto.nome,
              foto: this.formProduto.foto,
              estoque: Number(this.formProduto.estoque),
              custo: Number(this.formProduto.custo),
              preco: Number(this.formProduto.preco),
              vendidos: 0
            });
            this.formProduto = { nome: '', foto: '', estoque: 0, custo: 0, preco: 0 };
            alert("Produto cadastrado com sucesso na Lojinha!");
          } catch(e) { alert("Erro ao salvar produto. Verifique se ativou o Firestore em modo de teste."); console.error(e); }
          this.carregando = false;
        },

        async salvarCliente() {
          if(!this.formCliente.nome) return alert("Preencha o nome do cliente!");
          this.carregando = true;
          try {
            await addDoc(collection(db, "clientes"), {
              nome: this.formCliente.nome,
              whatsapp: this.formCliente.whatsapp,
              obs: this.formCliente.obs
            });
            this.formCliente = { nome: '', whatsapp: '', obs: '' };
            alert("Cliente cadastrado com sucesso na Lojinha!");
          } catch(e) { alert("Erro ao salvar cliente."); console.error(e); }
          this.carregando = false;
        },

        atualizarPrecoVenda() {
          const prod = this.produtos.find(p => p.id === this.formVenda.produtoId);
          if(prod) {
            this.formVenda.valorOriginal = prod.preco;
            this.calcularTotal();
          }
        },

        calcularTotal() {
          this.formVenda.valorFinal = this.formVenda.valorOriginal - (this.formVenda.desconto || 0);
        },

        async finalizarVenda() {
          if(!this.formVenda.clienteId || !this.formVenda.produtoId) return alert("Selecione cliente e produto!");
          
          const prod = this.produtos.find(p => p.id === this.formVenda.produtoId);
          if(prod.estoque <= 0) return alert("Produto sem estoque!");

          this.carregando = true;
          try {
            // 1. Registra a venda na nuvem
            await addDoc(collection(db, "vendas"), {
              data: new Date().toISOString(),
              clienteId: this.formVenda.clienteId,
              produtoId: this.formVenda.produtoId,
              valorOriginal: Number(this.formVenda.valorOriginal),
              desconto: Number(this.formVenda.desconto),
              valorFinal: Number(this.formVenda.valorFinal),
              pagamento: this.formVenda.pagamento,
              parcelas: Number(this.formVenda.parcelas)
            });

            // 2. Atualiza o estoque do produto vendido na nuvem
            const prodRef = doc(db, "produtos", prod.id);
            await updateDoc(prodRef, {
              estoque: prod.estoque - 1,
              vendidos: (prod.vendidos || 0) + 1
            });

            alert("Venda realizada e estoque atualizado!");
            this.formVenda = { clienteId: '', produtoId: '', valorOriginal: 0, desconto: 0, valorFinal: 0, pagamento: 'Dinheiro', parcelas: 1 };
          } catch(e) { alert("Erro ao processar venda."); console.error(e); }
          this.carregando = false;
        },

        obterNomeProduto(id) {
          const p = this.produtos.find(x => x.id === id);
          return p ? p.nome : 'Excluído';
        },

        obterNomeCliente(id) {
          const c = this.clientes.find(x => x.id === id);
          return c ? c.nome : 'Excluído';
        },

        gerarLinkAgenda(venda) {
          const cliente = this.obterNomeCliente(venda.clienteId);
          const valorParcela = (venda.valorFinal / venda.parcelas).toFixed(2);
          const titulo = encodeURIComponent(`Cobrança Parcela - ${cliente}`);
          const detalhes = encodeURIComponent(`Lembrete de cobrança da Lojinha.\nCliente: ${cliente}\nValor da parcela: R$ ${valorParcela}\nTotal de parcelas: ${venda.parcelas}x`);
          return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${titulo}&details=${detalhes}`;
        },

        copiarLink() {
          navigator.clipboard.writeText(window.location.href);
          alert("Link do catálogo copiado! Envie no WhatsApp para seus clientes.");
        }
      }))
    })
  </script>
</body>
</html>
